name: Build & Push ARM64 Image to GHCR

on:
  push:
    branches:
      - copilot/create-distributed-alpha-system
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bingaigc/alpha-detector-service

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/alpha-detector-service:latest
            ghcr.io/${{ github.actor }}/alpha-detector-service:${{ github.sha }}
