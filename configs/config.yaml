system:
  name: "CAMP-I Alpha Detector"
  version: "1.0.0"
  environment: "development"
  log_level: "info"

data_source:
  primary: "eastmoney"
  timeout: 10s
  max_retry: 3

ai:
  provider: "kimi"
  model: "moonshot-v1-8k"
  base_url: "https://api.moonshot.cn/v1"
  api_key: ""  # 从环境变量 ALPHA_KIMI_API_KEY 读取
  timeout: 30s
  max_retry: 2

risk:
  daily_max_loss: 50000.0
  max_signals_per_day: 20
  max_consecutive_losses: 3
  min_confidence: 0.6

pipeline:
  workers: 3
  batch_size: 20
  limit: 100

observability:
  enable_tracing: true
  enable_metrics: true
