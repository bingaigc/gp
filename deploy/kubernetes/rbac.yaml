apiVersion: v1
kind: Namespace
metadata:
  name: trading
  labels:
    name: trading
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-detector-sa
  namespace: trading
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alpha-detector-role
  namespace: trading
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha-detector-rolebinding
  namespace: trading
subjects:
- kind: ServiceAccount
  name: alpha-detector-sa
  namespace: trading
roleRef:
  kind: Role
  name: alpha-detector-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alpha-detector-ingress
  namespace: trading
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - alpha.trading.example.com
    secretName: alpha-tls
  rules:
  - host: alpha.trading.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpha-detector-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: trading
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
  selector:
    app: kafka
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alpha-detector-metrics
  namespace: trading
  labels:
    app: alpha-detector
spec:
  selector:
    matchLabels:
      app: alpha-detector
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
